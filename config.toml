# ============================================================
# 戳一戳自动回复插件 — 配置
# ============================================================

# 是否自动回戳对方（true = 开启，false = 关闭）
enable_poke_back = true

# bot 在 QQ 上的昵称。填入后会自动注入到戳一戳文本的动作与后缀之间
# 例如："捏了捏 [昵称] 的脸"
# 留空则不注入
bot_nickname = ""

# ---------- 插件基础设置 ----------
[plugin]
# 是否启用插件
enabled = true
# 配置版本号，请勿手动修改
config_version = "1.0.0"
